<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function drawer</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="../style.css"> 
</head>
<body class="crt">
    <a class="back" href="../index.html"><--</a>
    <h1>Draw function</h1>
    <div class="main">
        <canvas id="canvas" height="900" width="900"> </canvas>
        <div class="controls">
            <div>
                <input type="text" id="stringField" placeholder="ex.x**(Math.cos(x))"/>
            </div>
            <div>
                <label for="zoom">Zoom:</label>
                <input id="zoom" type="range" min="1" max="100" value="1">
            </div>

            <div class="derivativeBox">
                <span class="math">D(</span>
                <input id="derivativeField" type="text" placeholder="x">
                <span class="math">) =  </span>
                <span id="showDerivative"></span>
            </div>

            <div class="limitBox">
                <div class="limSymbol">
                    <span>lim</span>
                    <span class="under">
                        x ->  <input id="limitField" type="text" placeholder="x">
                    </span>
                </div>

                <span> = </span>
                <span id="showLimit"></span>
            </div>
        </div>
    </div>
</body>
</html>
